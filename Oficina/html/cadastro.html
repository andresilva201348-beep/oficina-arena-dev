<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/cadastro.css">
    <title>Oficina Arena Dev</title>
</head>

<body class="pagina-cadastro">

    <main class="main cadastro">

        <section class="cadastro-container">

            <div class="logo-cadastro">
                <img src="../assets/logo arena.png" alt="Logo da Oficina Arena Dev">

                <h1>Oficina Arena Dev</h1>
            </div>

            <div class="cadastro-intro">
                <h2>Crie sua conta</h2>
                <p>Junte-se à nossa comunidade e comece a colaborar.</p>
            </div>
            <form class="cadastro-form">
                <div class="input-group">
                    <i class="bi bi-person" aria-hidden="true"></i>
                    <input type="text" id="nome" name="nomeCompleto" placeholder="Nome completo" required>
                </div>

                <div class="input-group">
                    <i class="bi bi-person" aria-hidden="true"></i>
                    <input type="text" id="usuario" name="usuario"
                        placeholder="Nome de usuário (será seu nome na comunidade)" required>
                </div>

                <div class="input-group">
                    <i class="bi bi-envelope" aria-hidden="true"></i>
                    <input type="email" id="email" name="email" placeholder="E-mail" required>
                </div>

                <div class="input-group">
                    <i class="bi bi-lock" aria-hidden="true"></i>
                    <input type="password" id="senha" name="senha" placeholder="Senha" required>
                    <button type="button" aria-label="Mostrar senha">
                        <i class="bi bi-eye" aria-hidden="true"></i>
                    </button>
                </div>

                <div class="input-group">
                    <i class="bi bi-lock" aria-hidden="true"></i>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirmar senha"
                        required>
                    <button type="button" aria-label="Mostrar confirmação de senha">
                        <i class="bi bi-eye" aria-hidden="true"></i>
                    </button>
                </div>

                <button class="cadastro-btn" type="submit">
                    <i class="bi bi-person" aria-hidden="true"></i>
                    Cadastrar →
                </button>
            </form>
            <div class="cadastro-footer">
                <p>Já tem uma conta? <a href="login.html">Entrar</a></p>

                <a href="home.html">Voltar para a página inicial</a>
                <div>

        </section>
    </main>
</body>

</html>
